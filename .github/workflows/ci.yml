name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: CI debug info
        run: |
          python --version
          python -m pip --version
          python -m pip freeze

      - name: Run tests (verbose)
        run: |
          pytest -q -k "not slow" -vv evaluation || (echo "PYTEST FAILED, printing last 200 lines:" && tail -n 200 .pytest_cache/v/cache/lastfailed || true; exit 1)
